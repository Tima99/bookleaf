openapi: 3.1.0
info:
  title: BookLeaf Author Support API
  version: 1.0.0
  description: |
    REST API for the BookLeaf Author Support & Communication Portal.

    **Authentication** — `POST /api/v1/auth/login` sets an HTTP-only `bl_session` cookie and returns a
    `csrfToken`. Send that token in the `X-CSRF-Token` header on every POST/PATCH request.

    **Envelope** — success: `{ "success": true, "data": ... }` (paginated lists add `meta`);
    error: `{ "success": false, "error": { "code", "message", "details?", "requestId" } }`.

    **Roles** — `AUTHOR` endpoints are always scoped to the signed-in author (identity comes from the
    session, never from the request). `ADMIN` endpoints live under `/api/v1/admin`.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Author
  - name: Author tickets
  - name: Admin tickets
  - name: Admin
  - name: AI configuration
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bl_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-f0-9]{24}$' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      properties:
        success: { const: false }
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                [
                  VALIDATION_ERROR,
                  UNAUTHENTICATED,
                  INVALID_CREDENTIALS,
                  SESSION_EXPIRED,
                  CSRF_TOKEN_INVALID,
                  FORBIDDEN,
                  NOT_FOUND,
                  CONFLICT,
                  INVALID_STATE_TRANSITION,
                  RATE_LIMITED,
                  AI_UNAVAILABLE,
                  PAYLOAD_TOO_LARGE,
                  INTERNAL_ERROR,
                  SERVICE_UNAVAILABLE,
                ]
            message: { type: string }
            details:
              type: array
              items:
                { type: object, properties: { path: { type: string }, message: { type: string } } }
            requestId: { type: string }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    TicketCategory:
      type: string
      enum:
        [
          ROYALTY_PAYMENTS,
          ISBN_METADATA,
          PRINTING_QUALITY,
          DISTRIBUTION_AVAILABILITY,
          BOOK_STATUS_PRODUCTION,
          GENERAL_INQUIRY,
        ]
    TicketPriority:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]
    Session:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: string }
            role: { type: string, enum: [AUTHOR, ADMIN] }
            authorCode: { type: [string, 'null'] }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    Book:
      type: object
      description: Nullable fields are null for books still in production.
      properties:
        id: { type: string }
        bookCode: { type: string, example: BK001 }
        title: { type: string }
        isbn: { type: [string, 'null'] }
        genre: { type: string }
        publicationDate: { type: [string, 'null'], format: date }
        status: { type: string, example: Published & Live }
        stage: { type: string, enum: [PUBLISHED, IN_PRODUCTION] }
        productionStage: { type: [string, 'null'], example: Cover Design }
        mrp: { type: [number, 'null'] }
        authorRoyaltyPerCopy: { type: [number, 'null'] }
        totalCopiesSold: { type: integer }
        totalRoyaltyEarned: { type: number }
        royaltyPaid: { type: number }
        royaltyPending: { type: number }
        lastRoyaltyPayoutDate: { type: [string, 'null'], format: date }
        printPartner: { type: [string, 'null'] }
        availableOn: { type: array, items: { type: string } }
    CreateTicket:
      type: object
      required: [bookId, subject, description]
      properties:
        bookId:
          {
            type: [string, 'null'],
            description: 'Book code (e.g. BK001) or null for General / Account Level',
          }
        subject: { type: string, minLength: 5, maxLength: 150 }
        description: { type: string, minLength: 20, maxLength: 5000 }
    TicketMessage:
      type: object
      properties:
        id: { type: string }
        senderType: { type: string, enum: [AUTHOR, ADMIN] }
        senderName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    AuthorTicketSummary:
      type: object
      properties:
        id: { type: string }
        reference: { type: string, example: BL-1001 }
        subject: { type: string }
        book:
          {
            type: [object, 'null'],
            properties:
              { id: { type: string }, bookCode: { type: string }, title: { type: string } },
          }
        category: { oneOf: [{ $ref: '#/components/schemas/TicketCategory' }, { type: 'null' }] }
        priority: { oneOf: [{ $ref: '#/components/schemas/TicketPriority' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/TicketStatus' }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        latestAdminResponse:
          {
            type: [object, 'null'],
            properties: { excerpt: { type: string }, createdAt: { type: string } },
          }
        hasTeamReply: { type: boolean }
    AuthorTicketDetail:
      allOf:
        - $ref: '#/components/schemas/AuthorTicketSummary'
        - type: object
          properties:
            description: { type: string }
            messages: { type: array, items: { $ref: '#/components/schemas/TicketMessage' } }
            canReply: { type: boolean }
    AdminTicketSummary:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        subject: { type: string }
        author:
          {
            type: object,
            properties:
              { id: { type: string }, authorCode: { type: string }, name: { type: string } },
          }
        category: { oneOf: [{ $ref: '#/components/schemas/TicketCategory' }, { type: 'null' }] }
        categorySource: { type: [string, 'null'], enum: [AI, RULES, ADMIN, null] }
        priority: { oneOf: [{ $ref: '#/components/schemas/TicketPriority' }, { type: 'null' }] }
        prioritySource: { type: [string, 'null'], enum: [AI, RULES, ADMIN, null] }
        status: { $ref: '#/components/schemas/TicketStatus' }
        triageStatus: { type: string, enum: [PENDING, COMPLETED, FAILED, SKIPPED] }
        assignee:
          { type: [object, 'null'], properties: { id: { type: string }, name: { type: string } } }
        awaitingTeamReply: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
    AdminTicketDetail:
      allOf:
        - $ref: '#/components/schemas/AdminTicketSummary'
        - type: object
          description: Includes description, authorProfile, bookDetail, triage (AI/rules output with rationale and strategy versions), messages, internalNotes, activity, cached draft and allowedTransitions.
    AiDraft:
      type: object
      properties:
        id: { type: string }
        body: { type: string }
        source: { type: string, enum: [AI, TEMPLATE] }
        model: { type: [string, 'null'] }
        strategy: { type: [object, 'null'] }
        knowledgeSectionsUsed: { type: array, items: { type: string } }
        verificationChecklist: { type: array, items: { type: string } }
        suggestedStatus: { type: string, enum: [IN_PROGRESS, RESOLVED] }
        escalationRecommended: { type: boolean }
        stale: { type: boolean }
        generatedAt: { type: string, format: date-time }
    AiStrategyConfig:
      type: object
      properties:
        instructions: { type: string }
        categoryInstructions: { type: string }
        tone: { type: string }
        priorityRules: { type: array, items: { type: string } }
        floorRules:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              keywords: { type: array, items: { type: string } }
              minimumPriority: { $ref: '#/components/schemas/TicketPriority' }
        knowledgeSections: { type: array, items: { type: string } }
        provider: { type: string, enum: [anthropic, openai] }
        model: { type: string }
        temperature: { type: [number, 'null'] }
        maxOutputTokens: { type: integer }
        includeExamples: { type: boolean }
        maxHistoryMessages: { type: integer }
security:
  - sessionCookie: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses: { '200': { description: OK } }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (database connectivity)
      security: []
      responses: { '200': { description: Ready }, '503': { description: Database unavailable } }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email, password],
                properties: { email: { type: string }, password: { type: string } },
              }
      responses:
        '200':
          {
            description: Session created (sets bl_session cookie),
            content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookie
      security: []
      responses: { '200': { description: Logged out } }
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current session (user + CSRF token)
      responses:
        '200':
          {
            description: OK,
            content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } },
          }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/authors/me:
    get:
      {
        tags: [Author],
        summary: Signed-in author's profile (AUTHOR),
        responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Error' } },
      }
  /api/v1/authors/me/dashboard:
    get:
      {
        tags: [Author],
        summary: 'Totals (books, sales, royalties, open tickets) and royalty calendar (AUTHOR)',
        responses: { '200': { description: OK } },
      }
  /api/v1/authors/me/books:
    get:
      tags: [Author]
      summary: Paginated list of the author's books (AUTHOR)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: search, in: query, schema: { type: string } }
        - { name: stage, in: query, schema: { type: string, enum: [PUBLISHED, IN_PRODUCTION] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      data: { type: array, items: { $ref: '#/components/schemas/Book' } },
                      meta: { $ref: '#/components/schemas/PaginationMeta' },
                    },
                }
  /api/v1/authors/me/books/{bookId}:
    get:
      tags: [Author]
      summary: One of the author's books by book code (404 for other authors' books)
      parameters: [{ name: bookId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }

  /api/v1/tickets:
    post:
      tags: [Author tickets]
      summary: Create a support ticket (AUTHOR). AI triage runs asynchronously; creation never depends on AI.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/CreateTicket' } } },
        }
      responses:
        '201':
          {
            description: Created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AuthorTicketDetail' } } },
          }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/tickets/mine:
    get:
      tags: [Author tickets]
      summary: The author's tickets (filter by status, search subject / BL-number)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - {
            name: status,
            in: query,
            description: Comma-separated statuses,
            schema: { type: string },
          }
        - { name: search, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
  /api/v1/tickets/mine/events:
    get:
      tags: [Author tickets]
      summary: Server-Sent Events stream of the author's ticket events (ids only; never notes)
      responses: { '200': { description: text/event-stream } }
  /api/v1/tickets/mine/{id}:
    get:
      tags: [Author tickets]
      summary: Ticket detail with public conversation only
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        {
          '200':
            {
              description: OK,
              content:
                {
                  application/json: { schema: { $ref: '#/components/schemas/AuthorTicketDetail' } },
                },
            },
          '404': { $ref: '#/components/responses/Error' },
        }
  /api/v1/tickets/mine/{id}/messages:
    post:
      tags: [Author tickets]
      summary: Author follow-up message (re-opens a RESOLVED ticket; 409 when CLOSED)
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [body],
                      properties: { body: { type: string, maxLength: 10000 } },
                    },
                },
            },
        }
      responses:
        { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' } }

  /api/v1/admin/tickets:
    get:
      tags: [Admin tickets]
      summary: Ticket queue (ADMIN) — server-side filtering, sorting and pagination
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - {
            name: search,
            in: query,
            description: 'Subject, author name/email/code or BL-number',
            schema: { type: string },
          }
        - { name: status, in: query, description: Comma-separated, schema: { type: string } }
        - { name: category, in: query, description: Comma-separated, schema: { type: string } }
        - { name: priority, in: query, description: Comma-separated, schema: { type: string } }
        - {
            name: assignee,
            in: query,
            description: 'me | unassigned | admin user id',
            schema: { type: string },
          }
        - { name: authorId, in: query, schema: { type: string } }
        - { name: createdFrom, in: query, schema: { type: string, format: date } }
        - { name: createdTo, in: query, schema: { type: string, format: date } }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [urgency, newest, oldest, updated, priority],
                default: urgency,
              },
          }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                {
                  type: object,
                  properties:
                    {
                      data:
                        { type: array, items: { $ref: '#/components/schemas/AdminTicketSummary' } },
                      meta: { $ref: '#/components/schemas/PaginationMeta' },
                    },
                }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/admin/tickets/{id}:
    get:
      tags: [Admin tickets]
      summary: Full ticket workspace data (including internal notes and activity)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        {
          '200':
            {
              description: OK,
              content:
                {
                  application/json: { schema: { $ref: '#/components/schemas/AdminTicketDetail' } },
                },
            },
        }
    patch:
      tags: [Admin tickets]
      summary: Update status and/or override category / priority (overrides are never replaced by later AI runs)
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { $ref: '#/components/schemas/TicketStatus' }
                category: { $ref: '#/components/schemas/TicketCategory' }
                priority: { $ref: '#/components/schemas/TicketPriority' }
      responses:
        {
          '200': { description: OK },
          '409': { description: Invalid status transition },
          '422': { $ref: '#/components/responses/Error' },
        }
  /api/v1/admin/tickets/{id}/assign:
    post:
      tags: [Admin tickets]
      summary: Assign to an admin (assigneeId) or unassign (null)
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { type: object, properties: { assigneeId: { type: [string, 'null'] } } },
                },
            },
        }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/tickets/{id}/notes:
    post:
      tags: [Admin tickets]
      summary: Add an internal note (never visible to authors)
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [body],
                      properties: { body: { type: string, maxLength: 5000 } },
                    },
                },
            },
        }
      responses: { '201': { description: Created } }
  /api/v1/admin/tickets/{id}/responses:
    post:
      tags: [Admin tickets]
      summary: Send a public response to the author (records draft provenance)
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 10000 }
                statusAfter: { type: string, enum: [IN_PROGRESS, RESOLVED] }
                draftId: { type: [string, 'null'] }
      responses: { '201': { description: Created }, '409': { description: Ticket closed } }
  /api/v1/admin/tickets/{id}/ai/classify:
    post:
      tags: [Admin tickets]
      summary: Re-run AI triage (falls back to rules; admin overrides preserved)
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: OK }, '429': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/tickets/{id}/ai/draft:
    post:
      tags: [Admin tickets]
      summary: Get the cached AI draft or generate one (force=true to regenerate). Returns a policy template + failure when AI is unavailable.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        {
          content:
            {
              application/json:
                {
                  schema:
                    { type: object, properties: { force: { type: boolean, default: false } } },
                },
            },
        }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft: { oneOf: [{ $ref: '#/components/schemas/AiDraft' }, { type: 'null' }] }
                  failure:
                    {
                      type: [object, 'null'],
                      properties: { kind: { type: string }, message: { type: string } },
                    }
                  fromCache: { type: boolean }

  /api/v1/admin/dashboard:
    get:
      {
        tags: [Admin],
        summary: Operations dashboard counters,
        needs-attention list and recent activity,
        responses: { '200': { description: OK } },
      }
  /api/v1/admin/authors:
    get:
      tags: [Admin]
      summary: Author directory with book and open-ticket counts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: search, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
  /api/v1/admin/authors/{id}:
    get:
      tags: [Admin]
      summary: Author detail with books, tickets and royalty totals
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }
  /api/v1/admin/users:
    get:
      {
        tags: [Admin],
        summary: Active admins (assignee picker),
        responses: { '200': { description: OK } },
      }
  /api/v1/admin/events:
    get:
      {
        tags: [Admin],
        summary: Server-Sent Events stream of all ticket events,
        responses: { '200': { description: text/event-stream } },
      }

  /api/v1/admin/ai/status:
    get:
      {
        tags: [AI configuration],
        summary: 'Provider configuration, default models, circuit-breaker state, 24h usage',
        responses: { '200': { description: OK } },
      }
  /api/v1/admin/ai/knowledge-base:
    get:
      {
        tags: [AI configuration],
        summary: Knowledge-base sections used for drafting,
        responses: { '200': { description: OK } },
      }
  /api/v1/admin/ai/runs:
    get:
      tags: [AI configuration]
      summary: AI execution log (latency, tokens, failures)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - { name: strategyId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [SUCCESS, FAILED] } }
      responses: { '200': { description: OK } }
  /api/v1/admin/ai/strategies:
    get:
      tags: [AI configuration]
      summary: List strategies (filter by kind / category)
      parameters:
        - {
            name: kind,
            in: query,
            schema: { type: string, enum: [CLASSIFICATION, PRIORITY, RESPONSE] },
          }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/TicketCategory' } }
      responses: { '200': { description: OK } }
    post:
      tags: [AI configuration]
      summary: Create a strategy (version 1)
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, category, config]
              properties:
                name: { type: string }
                purpose: { type: string }
                enabled: { type: boolean }
                kind: { type: string, enum: [CLASSIFICATION, PRIORITY, RESPONSE] }
                category:
                  { oneOf: [{ $ref: '#/components/schemas/TicketCategory' }, { type: 'null' }] }
                config: { $ref: '#/components/schemas/AiStrategyConfig' }
                changeNote: { type: string }
      responses:
        {
          '201': { description: Created },
          '409': { $ref: '#/components/responses/Error' },
          '422': { $ref: '#/components/responses/Error' },
        }
  /api/v1/admin/ai/strategies/{id}:
    get:
      tags: [AI configuration]
      summary: Strategy with active configuration and run stats
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: OK } }
    patch:
      tags: [AI configuration]
      summary: Update metadata / enable-disable; supplying config saves a new immutable version
      security: [{ sessionCookie: [], csrfHeader: [] }]
