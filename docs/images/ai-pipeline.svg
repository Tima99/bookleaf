<text x="286" y="180" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">• Priority rubric for each category</text>
<text x="452" y="137" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start">✗ no knowledge base</text>
